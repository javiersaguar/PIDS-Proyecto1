# Configuración común del clúster (máster, workers y trabajos)

spark.sql.session.timeZone                      UTC
spark.sql.parquet.compression.codec             zstd

# Máster: pasarela REST para que Airflow envíe trabajos en modo cluster y siga su estado.
# Sin autenticación: el puerto 6066 solo es accesible dentro de la red de Docker.
spark.master.rest.enabled                       true
spark.master.rest.port                          6066
# Sin esto, el primer trabajo (el streaming) se quedaría con todos los núcleos del clúster
spark.deploy.defaultCores                       2

# Métricas para Prometheus
spark.ui.prometheus.enabled                     true

# S3 (SeaweedFS). Las credenciales llegan por variables de entorno del contenedor.
spark.hadoop.fs.s3a.endpoint                    http://s3:8333
spark.hadoop.fs.s3a.endpoint.region             us-east-1
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.aws.credentials.provider    software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider

# Oculta en la interfaz web cualquier valor que parezca un secreto o una cadena de conexión
spark.redaction.regex                           (?i)secret|password|token|access[.]?key|uri

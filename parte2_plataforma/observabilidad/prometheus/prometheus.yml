# Qué mide Prometheus. Los servicios de perfiles que no estén levantados aparecen como "down".
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: captura
    metrics_path: /metrics/
    static_configs:
      - targets: ["captura:8000"]

  - job_name: acceso
    metrics_path: /metrics/
    static_configs:
      - targets: ["acceso:8000"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: s3
    static_configs:
      - targets: ["s3:9327"]

  - job_name: spark-master
    metrics_path: /metrics/master/prometheus
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: spark-aplicaciones
    metrics_path: /metrics/applications/prometheus
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: spark-workers
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["spark-worker-1:8081", "spark-worker-2:8081"]

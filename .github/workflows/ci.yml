name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parte4_frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parte4_frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests de Scala (en la etapa de compilación de la imagen)
        run: >-
          docker build --target compilacion --build-arg EJECUTAR_TESTS=true
          -f parte2_plataforma/spark/Dockerfile .

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml válido con todos los perfiles
        run: |
          python3 scripts/generar_env.py
          docker compose --profile spark --profile airflow --profile observabilidad \
            --profile chatbot --profile frontend --profile herramientas --profile simulador config --quiet
